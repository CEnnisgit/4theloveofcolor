<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-route head tags — <title>, description, canonical, robots, Open Graph
      and Twitter — are injected at the marker below by scripts/prerender.mjs,
      which writes one static HTML file per route from the table in
      src/routes.ts.

      Do not hard-code them in this template. A single shared canonical here is
      what previously told Google that every page on the site was a duplicate
      of the home page.
    -->
    <!--seo-->

    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="theme-color" content="#b95b33" />
    <meta property="og:site_name" content="4 The Love of Color Painting" />

    <!-- Local SEO geo signals -->
    <meta name="geo.region" content="US-FL" />
    <meta name="geo.placename" content="Lakewood Ranch, Sarasota" />

    <!-- LocalBusiness structured data (local SEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HousePainter",
      "@id": "https://www.4theloveofcolorpainting.com/#business",
      "name": "4 The Love of Color Painting",
      "image": "https://www.4theloveofcolorpainting.com/images/proj-exterior-white-2story.jpg",
      "logo": "https://www.4theloveofcolorpainting.com/images/logo.png",
      "url": "https://www.4theloveofcolorpainting.com/",
      "telephone": "+19175840069",
      "email": "4theloveofcolorpainting@gmail.com",
      "description": "Family-owned interior and exterior painting company serving Lakewood Ranch, Sarasota, Bradenton and the surrounding Suncoast of Florida.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Lakewood Ranch",
        "addressRegion": "FL",
        "addressCountry": "US"
      },
      "areaServed": [
        { "@type": "City", "name": "Lakewood Ranch" },
        { "@type": "City", "name": "Sarasota" },
        { "@type": "City", "name": "Bradenton" },
        { "@type": "City", "name": "Palmetto" },
        { "@type": "City", "name": "Parrish" },
        { "@type": "City", "name": "Venice" },
        { "@type": "City", "name": "Osprey" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
        "opens": "08:00",
        "closes": "18:00"
      },
      "sameAs": ["https://www.instagram.com/4theloveofcolorpainting/"],
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Interior Painting" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Exterior Painting" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cabinet Refinishing & Specialty Finishes" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Commercial Painting" } }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <!--
      Netlify Forms detection stub. Netlify scans the BUILT HTML for forms at
      deploy time; a React-rendered form is invisible to that scan, so this
      hidden copy registers the "estimate" form and its fields. The real,
      visible form lives in App.tsx (ContactPage) and POSTs to it.
      Field names here must stay in sync with that form.
    -->
    <form name="estimate" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="project_type" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <!--
      Prerendered route markup is written into this container at build time.
      No <noscript> fallback is needed any more: the static file already holds
      the full page, so a visitor or crawler without JavaScript sees the real
      content rather than a stub.
    -->
    <div id="root"></div>
  </body>
</html>
