[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# No SPA fallback. The build prerenders a static HTML file per route, so
# Netlify serves those directly and unmatched paths fall through to 404.html
# with a real 404 status. Redirects for retired URLs live in public/_redirects.

# Hashed JS/CSS bundles never change content — cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images change rarely — cache a week, allow revalidation.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Baseline security headers for the whole site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
